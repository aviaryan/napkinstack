    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search).get('t')
          var t =
            q === 'bp' || q === 'blueprint'
              ? 'blueprint'
              : q === 'paper'
                ? 'paper'
                : localStorage.getItem('napkinstack-theme') || localStorage.getItem('archsketch-theme')
          if (t === 'blueprint') document.documentElement.setAttribute('data-theme', 'blueprint')
        } catch (e) {}
      })()
    </script>
